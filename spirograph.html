<div class="spirograph-container">
    
    
    <div class="box control-box">
        <h3>Spirograph</h3>
        <div class="input-group">
            <label>Radius of the outer fixed circle, R:</label>
            <input type="number" id="inputR" value="125" min="1">
        </div>
        
        <div class="input-group">
            <label>Radius of the rotating inner circle, r:</label>
            <input type="number" id="inputr" value="60" min="1">
        </div>
        
        <div class="input-group">
            <label>Offset of the pen from the center of the inner circle, O:</label>
            <input type="number" id="inputO" value="60" min="1">
        </div>
        
        <div class="button-group">
            <button onclick="drawSpirograph();">Draw</button>
        </div>

    </div>

        <canvas id="myCanvas" width="700" height="650"></canvas>
    </div>

<script>
    var closetimer = 0;
    var ddmenuitem = 0;

    function mopen(id) {
        mcancelclosetime();

        if (ddmenuitem) {
            ddmenuitem.style.visibility = 'hidden';
        }

        ddmenuitem = document.getElementById(id);
        ddmenuitem.style.visibility = 'visible';
    }

    function mclose() {
        if (ddmenuitem) {
            ddmenuitem.style.visibility = 'hidden';
        }
    }

    function mclosetime() {
        closetimer = window.setTimeout(mclose, 1000);
    }

    function mcancelclosetime() {
        if (closetimer) {
            window.clearTimeout(closetimer);
            closetimer = null;
        }
    }

    document.onclick = mclose;

    function Spirograph(R, r, O, cx, cy) {
        this.R = R;
        this.r = r;
        this.O = O;
        this.centerX = cx;
        this.centerY = cy;
         
        this.draw = draw;
        function draw(context) {
            function newColor() {
                var color = '#' + Math.floor(Math.random() * 16777215).toString(16);
                context.strokeStyle = color;
            }

            var prevX = this.X(0);
            var prevY = this.Y(0);

            for (var t = 0.05; t <= 100 * Math.PI; t += 0.05) {
                var currX = this.X(t);
                var currY = this.Y(t);

                context.beginPath();
                context.moveTo(prevX, prevY);
                context.lineTo(currX, currY);
                
                newColor();
                context.stroke();

                prevX = currX;
                prevY = currY;
            }
       }
        
        this.X = X;   
        function X(t) {
            return (this.R + this.r) * Math.cos(t) - (this.r + this.O) * Math.cos(((this.R + this.r) / this.r) * t) + this.centerX;
        }
        
        this.Y = Y;
        function Y(t) {
            return (this.R + this.r) * Math.sin(t) - (this.r + this.O) * Math.sin(((this.R + this.r) / this.r) * t) + this.centerY;    
        }
    }


    function drawSpirograph() {
        var rInput = document.getElementById("inputR").value;
        var inInput = document.getElementById("inputr").value;
        var oInput = document.getElementById("inputO").value;

        var R = parseFloat(rInput);
        var r = parseFloat(inInput);
        var O = parseFloat(oInput);

        var errorMsg = document.getElementById("message");

        if (r > R) {
            errorMsg.innerHTML = "Error: r cannot be greater than R!";
            return;
        } 

        var c = document.getElementById("myCanvas");
        var context = c.getContext("2d");


        var mySpirograph = new Spirograph(R, r, O, c.width / 2, c.height / 2);
        mySpirograph.draw(context);   
    }
</script>
